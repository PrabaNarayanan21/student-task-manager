<div class="container mt-5">

  <div class="row justify-content-center">

    <div class="col-md-4">

      <div class="card shadow p-4">

        <h2 class="text-center mb-4">
          Login
        </h2>

        <form (ngSubmit)="onLogin()">

          <!-- Email -->

          <div class="mb-3">

            <label class="form-label">
              Email
            </label>

            <input
              type="email"
              class="form-control"
              [(ngModel)]="email"
              name="email"
              required
            />

          </div>

          <!-- Password -->

          <div class="mb-3">

            <label class="form-label">
              Password
            </label>

            <input
              type="password"
              class="form-control"
              [(ngModel)]="password"
              name="password"
              required
            />

          </div>

          <!-- Button -->

          <button
            type="submit"
            class="btn btn-primary w-100">

            Login

          </button>

        </form>

      </div>

    </div>

  </div>

</div>
