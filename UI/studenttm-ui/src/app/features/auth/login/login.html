<div class="auth-page">
  <div class="auth-card">

    <div class="auth-logo">Student<span>TM</span></div>
    <p class="auth-tagline">Task Management made easy!</p>
    <h2>Welcome back</h2>
    <p class="auth-subtitle">Sign in to your account</p>

    <div class="form-group">
      <label>Email</label>
      <input type="email" [(ngModel)]="email" name="email" placeholder="you@email.com" />
    </div>

    <div class="form-group">
      <label>Password</label>
      <input type="password" [(ngModel)]="password" name="password" placeholder="••••••••" />
    </div>

    <button class="btn-primary" (click)="onLogin()">Login</button>

    <p class="auth-link">
      Don't have an account?
      <a routerLink="/register">Create one</a>
    </p>

  </div>
</div>
