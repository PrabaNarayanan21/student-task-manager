<div class="auth-page">
  <div class="auth-card">

    <div class="auth-logo">Student<span>TM</span></div>
    <p class="auth-tagline">Task Management made easy!</p>
    <h2>Create Account</h2>
    <p class="auth-subtitle">Join StudentTM today</p>

    <div class="form-group">
      <label>Username</label>
      <input type="text" [(ngModel)]="username" name="username" placeholder="Your name" />
    </div>

    <div class="form-group">
      <label>Email</label>
      <input type="email" [(ngModel)]="email" name="email" placeholder="you@email.com" />
    </div>

    <div class="form-group">
      <label>Password</label>
      <input type="password" [(ngModel)]="password" name="password" placeholder="••••••••" />
    </div>

    <button class="btn-primary" (click)="onRegister()">Register</button>

    <p class="auth-link">
      Already have an account?
      <a routerLink="/login">Sign in</a>
    </p>

  </div>
</div>
