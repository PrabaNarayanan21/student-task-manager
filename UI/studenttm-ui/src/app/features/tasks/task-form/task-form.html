<div class="task-form-container">

  <h2>
    {{
      isEditMode
        ? 'Edit Task'
        : 'Create New Task'
    }}
  </h2>

  <p class="form-subtitle">

    {{
      isEditMode
        ? 'Update your task details'
        : 'Fill in the details below to add a new task'
    }}

  </p>

  <!-- ERROR -->

  <div
    *ngIf="errorMessage"
    class="error-message">

    {{ errorMessage }}

  </div>

  <!-- TITLE -->

  <div class="form-group">

    <label for="title">

      Title
      <span class="required">*</span>

    </label>

    <input
      id="title"
      type="text"
      [(ngModel)]="title"
      placeholder="Enter task title"
    />

  </div>

  <!-- DESCRIPTION -->

  <div class="form-group">

    <label for="description">
      Description / Notes
    </label>

    <textarea
      id="description"
      [(ngModel)]="description"
      placeholder="Enter task description"
      rows="4">

    </textarea>

  </div>

  <div class="form-group">
  <label for="category">
    Category
    <span class="optional-label">(optional)</span>
  </label>
  <select id="category" [(ngModel)]="category">
    <option value="">Select a category</option>
    <option *ngFor="let cat of categoryOptions" [value]="cat">
      {{ cat }}
    </option>
  </select>
</div>

  <!-- DUE DATE -->

  <div class="form-group">
  <label for="dueDate">Due Date <span class="required">*</span></label>
  <input
    id="dueDate"
    type="date"
    [(ngModel)]="dueDate"
    [class.is-invalid]="errorMessage && !dueDate"
  />
</div>

<div class="form-group">
  <label for="taskTime">
    Pick Time
    <span class="optional-label">(optional)</span>
  </label>
  <input
    id="taskTime"
    type="time"
    [(ngModel)]="taskTime"
  />
  <small class="form-text">Set a specific time for this task</small>
</div>
  <!-- ROW -->

  <div class="form-row">

    <!-- PRIORITY -->

    <div class="form-group">

      <label for="priority">
        Priority
      </label>

      <select
        id="priority"
        [(ngModel)]="priority">

        <option
          *ngFor="let opt of priorityOptions"
          [value]="opt.value">

          {{ opt.label }}

        </option>

      </select>

    </div>

    <!-- STATUS -->

    <div class="form-group">

      <label for="status">
        Status
      </label>

      <select
        id="status"
        [(ngModel)]="status">

        <option
          *ngFor="let opt of statusOptions"
          [value]="opt.value">

          {{ opt.label }}

        </option>

      </select>

    </div>

  </div>

  <!-- ACTIONS -->

  <div class="form-actions">

    <button
      class="btn-submit"
      (click)="onSubmit()"
      [disabled]="isSubmitting">

      {{
        isSubmitting
          ? (
              isEditMode
                ? 'Updating...'
                : 'Creating...'
            )
          : (
              isEditMode
                ? 'Update Task'
                : 'Create Task'
            )
      }}

    </button>

    <button
      type="button"
      class="btn-cancel"
      [routerLink]="['/dashboard']">

      Cancel

    </button>

  </div>

</div>
